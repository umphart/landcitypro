<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <title>Admin Login - Landcity Properties</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0f3b3b 0%,#1a5c5c 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        .login-container{background:white;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,0.3);width:100%;max-width:440px;overflow:hidden}
        .login-header{background:#0f3b3b;padding:40px;text-align:center;color:white}
        .login-logo{width:80px;height:80px;border-radius:50%;margin-bottom:16px;border:3px solid #b8860b;object-fit:cover}
        .login-header h2{font-family:'Playfair Display',serif;font-size:1.8rem;margin-bottom:8px}
        .login-header p{opacity:0.8;font-size:0.9rem}
        .login-form{padding:40px}
        .form-group{margin-bottom:24px}
        .form-group label{display:block;margin-bottom:8px;font-weight:600;color:#1e293b;font-size:0.9rem}
        .input-wrapper{position:relative}
        .input-wrapper i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#94a3b8}
        .input-wrapper input{width:100%;padding:14px 16px 14px 44px;border:2px solid #e2e8f0;border-radius:12px;font-size:1rem;transition:all 0.3s}
        .input-wrapper input:focus{outline:none;border-color:#b8860b;box-shadow:0 0 0 3px rgba(184,134,11,0.1)}
        .btn-login{width:100%;padding:14px;background:#b8860b;color:white;border:none;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;transition:all 0.3s;margin-top:10px}
        .btn-login:hover{background:#9e7609;transform:translateY(-2px);box-shadow:0 8px 25px rgba(184,134,11,0.3)}
        .btn-login:disabled{opacity:0.6;cursor:not-allowed}
        .back-to-site{text-align:center;margin-top:20px}
        .back-to-site a{color:#64748b;text-decoration:none;font-size:0.9rem;transition:color 0.3s}
        .back-to-site a:hover{color:#b8860b}
        .error-message{background:#fef2f2;color:#dc2626;padding:12px;border-radius:8px;margin-bottom:20px;font-size:0.9rem;display:none;align-items:center;gap:8px}
        .error-message.show{display:flex}
        .spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);border-top:2px solid white;border-radius:50%;animation:spin 0.8s linear infinite;display:inline-block}
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <img src="assets/logo.jpeg" alt="Landcity Logo" class="login-logo">
            <h2>Admin Login</h2>
            <p>Landcity Properties Nigeria Limited</p>
        </div>
        <form class="login-form" id="loginForm">
            <div class="error-message" id="errorMessage"><i class="fas fa-exclamation-circle"></i><span id="errorText"></span></div>
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper"><i class="fas fa-user"></i><input type="text" id="username" placeholder="Enter your username" required autofocus></div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper"><i class="fas fa-lock"></i><input type="password" id="password" placeholder="Enter your password" required></div>
            </div>
            <button type="submit" class="btn-login" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Sign In</button>
        </form>
        <div class="back-to-site"><a href="index.html"><i class="fas fa-arrow-left"></i> Back to Website</a></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const loginBtn = document.getElementById('loginBtn');
            
            if (!username || !password) {
                showError('Please enter username and password');
                return;
            }
            
            loginBtn.innerHTML = '<span class="spinner"></span> Signing in...';
            loginBtn.disabled = true;
            
            try {
                let authenticated = false;
                let fullName = 'Admin User';
                
                if (supabase) {
                    try {
                        const { data: users } = await supabase
                            .from('admin_users')
                            .select('*')
                            .eq('username', username)
                            .single();
                        
                        if (users && password === 'admin123') {
                            authenticated = true;
                            fullName = users.full_name || username;
                        }
                    } catch (dbError) {
                        console.log('DB auth skipped:', dbError.message);
                    }
                }
                
                // Fallback authentication
                if (!authenticated && username === 'admin' && password === 'landcity2026') {
                    authenticated = true;
                }
                
                if (authenticated) {
                    sessionStorage.setItem('landcityAdminLoggedIn', 'true');
                    sessionStorage.setItem('landcityAdminUser', username);
                    sessionStorage.setItem('landcityAdminFullName', fullName);
                    window.location.href = 'admin.html';
                } else {
                    showError('Invalid username or password');
                }
            } catch (error) {
                showError('An error occurred. Please try again.');
            } finally {
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                loginBtn.disabled = false;
            }
        });
        
        function showError(msg) {
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            errorText.textContent = msg;
            errorMessage.classList.add('show');
            setTimeout(() => errorMessage.classList.remove('show'), 4000);
        }
        
        if (sessionStorage.getItem('landcityAdminLoggedIn') === 'true') {
            window.location.href = 'admin.html';
        }
    </script>
</body>
</html>
